version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      keycloak:
        patterns: ["org.keycloak:*"]
      test-dependencies:
        patterns: ["*"]
        exclude-patterns: ["org.keycloak:*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
