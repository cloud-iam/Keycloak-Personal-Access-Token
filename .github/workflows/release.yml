name: release

# Push a tag like v1.0.0 to build, test and publish a GitHub release with the provider jar attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set version from tag
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B verify

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="target/keycloak-personal-access-token-${GITHUB_REF_NAME#v}.jar"
          sha256sum "$JAR" > "$JAR.sha256"
          gh release create "$GITHUB_REF_NAME" "$JAR" "$JAR.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
